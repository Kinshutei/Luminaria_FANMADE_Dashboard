<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luminaria FANMADE Dashboard</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="layout">

    <aside id="sidebar">
      <div id="sidebar-title">
        <div id="sidebar-name">Luminaria</div>
        <div id="sidebar-sub">FANMADE Dashboard</div>
      </div>
      <nav id="nav">
        <button class="nav-btn active" data-section="dashboard">Dashboard</button>
        <div class="nav-divider"></div>
        <!-- タレントボタンはJSで生成 -->
      </nav>
      <div id="sidebar-note">非公式ファンメイド</div>
    </aside>

    <main id="main">

      <!-- Dashboard -->
      <section id="section-dashboard" class="section active">
        <h2>Dashboard</h2>
        <div class="talent-card-grid" id="dashboard-cards">読み込み中...</div>
      </section>

      <!-- タレントセクションはJSで生成 -->

    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
